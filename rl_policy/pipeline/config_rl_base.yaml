train:
  resume: null
  target_speed: 10

coef:
  v: 1.0
  collide: 15
  obj_avoidance: 6.0
  d_acc: 0.03
  d_jerk: 0.003
  d_snap: 0.0
  p_bound: 2.0
  p_center: 0.5

reward:
  speed_ema_alpha: 0.9
  obstacle_lookahead_time: 1.5
  obstacle_lookahead_steps: 10
  risk_clearance: 0.6
  brake_clearance: 0.7
  ttc_threshold: 1.5
  brake_decel: 3.5
  brake_stop_margin: 0.15
  max_closing_speed: 12.0

curriculum:
  enabled: true
  start_from_max: false

log:
  root: log_data/rl

eval:
  checkpoint: RL/log_data/rl/2026-07-09_18-28-18/model_5350.pt
  export_onnx: RL/log_data/rl/policy.onnx
  obstacle_level: 3
  keep_curriculum: true
  steps: 1500
  show_depth: true
  wait_ms: 100
  print_velocity: true

class_name: OnPolicyRunner
# General
num_steps_per_env: 20  # Number of steps per environment per iteration
max_iterations: 15000  # Number of policy updates
seed: 1
# Observations
obs_groups: {"policy": ["depth","state"], "critic": ["depth","state"]} # Maps observation groups to sets. See `vec_env.py` for more information
# Logging parameters
save_interval: 50  # Check for potential saves every `save_interval` iterations
experiment_name: hover_experiment
run_name: ""
# Logging writer
logger: tensorboard  # tensorboard, neptune, wandb
neptune_project: quad_model
wandb_project: quad_model

# Policy
policy:
  class_name: CustomVisionActorCritic
  dim_state: 14
  init_noise_std: 1.0
  rnn_type: "sru" # gru or sru
  rnn_hidden_dim: 192
  rnn_num_layers: 1
  base_model_path: RL/checkpoint3699.pth

  freeze_stem: true

# Algorithm
algorithm:
  class_name: PPO

  # class_name: MDPO
  # distill_coef: 0.02

  # Training
  learning_rate: 0.001
  num_learning_epochs: 5
  num_mini_batches: 4  # mini batch size = num_envs * num_steps / num_mini_batches
  schedule: adaptive  # adaptive, fixed
  # Value function
  value_loss_coef: 1.0
  clip_param: 0.2
  use_clipped_value_loss: true
  # Surrogate loss
  desired_kl: 0.01
  entropy_coef: 0.01
  gamma: 0.99
  lam: 0.95
  max_grad_norm: 1.0
  # Miscellaneous
  normalize_advantage_per_mini_batch: false

  # Random network distillation
  # rnd_cfg:
  #     weight: 0.0  # Initial weight of the RND reward
  #     weight_schedule: null # This is a dictionary with a required key called "mode". Please check the RND module for more information
  #     reward_normalization: false  # Whether to normalize RND reward
  #     # Learning parameters
  #     learning_rate: 0.001  # Learning rate for RND
  #     # Network parameters
  #     num_outputs: 1  # Number of outputs of RND network. Note: if -1, then the network will use dimensions of the observation
  #     predictor_hidden_dims: [-1] # Hidden dimensions of predictor network
  #     target_hidden_dims: [-1]  # Hidden dimensions of target network

  # # Symmetry augmentation
  # symmetry_cfg:
  #   use_data_augmentation: true  # This adds symmetric trajectories to the batch
  #   use_mirror_loss: false  # This adds symmetry loss term to the loss function
  #   data_augmentation_func: null # String containing the module and function name to import
  #   # Example: "legged_gym.envs.locomotion.anymal_c.symmetry:get_symmetric_states"
  #   #
  #   # .. code-block:: python
  #   #
  #   #     @torch.no_grad()
  #   #     def get_symmetric_states(
  #   #        obs: Optional[torch.Tensor] = None, actions: Optional[torch.Tensor] = None, cfg: "BaseEnvCfg" = None, obs_type: str = "policy"
  #   #     ) -> Tuple[torch.Tensor, torch.Tensor]:
  #   #
  #   mirror_loss_coeff: 0.0 # Coefficient for symmetry loss term. If 0, no symmetry loss is used
